# Install this optional bundle after dsh-web-app. The row is absent from the
# shipped Web profile until `dsh plugin --profile web add <package>` adds this
# package to that profile's bundle list.
- insert:
    - id: meeting-minutes
      name: '@deepseek-ai/dsh-meeting-minutes'
      config:
        storageRoot: !!js dshHomePath('meeting-minutes')
        asrMode: local
        localModelPath: !!js dshHomePath('models', 'Qwen3-ASR-1.7B')
        pythonExecutable: python3
        localDevice: auto
        language: Chinese
        asrChunkSeconds: 300
        asrRequestTimeoutMs: 1800000
        asrIdleShutdownMs: 300000
        asrMaxOutputTokens: 2048
        remoteEndpoint: http://127.0.0.1:8000/v1/chat/completions
        remoteModel: Qwen/Qwen3-ASR-1.7B
        remoteApiKeyEnv: QWEN_ASR_API_KEY
        summaryMaxInputBytes: 65536
        summaryMaxOutputTokens: 4096
        summaryMaxReductionRounds: 8
        summaryRequestTimeoutMs: 600000
        maxUploadBytes: 2147483648
        listMaxMeetings: 200
